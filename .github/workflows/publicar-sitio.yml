name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la carpeta sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5